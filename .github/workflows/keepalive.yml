name: Keep Render service awake

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Request health endpoint
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          set -eu
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "Repository variable KEEPALIVE_URL is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --user-agent "ClipGrab keepalive" \
            "$KEEPALIVE_URL/health"
          printf '\nHealth check succeeded.\n'
