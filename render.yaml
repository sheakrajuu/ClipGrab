services:
  - type: web
    name: clipgrab
    runtime: node
    healthCheckPath: /health
    buildCommand: npm install && npx playwright install chromium && python3 -m pip install yt-dlp curl-cffi
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIPGRAB_BROWSER_FALLBACK
        value: '1'
