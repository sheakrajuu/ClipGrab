<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipGrab — Save social media videos and images</title>
<link rel="icon" href="/icons/favicon.ico?v=6" type="image/x-icon">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180x180.png?v=6">
<meta name="theme-color" content="#A7FF1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101316;
    --panel:#FFFFFF;
    --section:#F5F6FA;
    --accent: #C8F35A;
    --accent-dark: #A7D63B;
    --text:#14161B;
    --muted:#6B7280;
    --border: #E0E4D8;
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  [hidden]{display:none !important;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:var(--section);
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Space Grotesk',sans-serif;
    margin:0;
  }
  a{color:inherit;text-decoration:none;overflow-wrap:anywhere;}
  img{max-width:100%;display:block;}

  /* ---------- Header ---------- */
  header{
    background:var(--bg);
    color:#fff;
    padding:20px 24px;
  }
  .header-inner{
    max-width:1080px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .header-tools{display:flex;align-items:center;gap:14px;}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .settings-btn{border:1px solid rgba(255,255,255,.24);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;padding:8px 12px;font:600 12px Inter,sans-serif;letter-spacing:.01em;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease;}
  .settings-btn:hover{background:rgba(200,243,90,.12);border-color:var(--accent);color:var(--accent);}
  .settings-btn:active{background:rgba(200,243,90,.2);}
  .lang{
    background:transparent;
    color:#fff;
    font-size:14px;
    font-family:inherit;
  }

  /* ---------- Hero ---------- */
  .eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;margin-bottom:15px;}
  .hero{
    background:var(--bg);
    color:#fff;
    padding:66px 24px 102px;
    text-align:center;
  }
  .hero-inner{max-width:720px;margin:0 auto;}
  .hero h1{
    font-size:clamp(28px,4vw,42px);
    font-weight:700;
    letter-spacing:0;
  }
  .hero p{
    color:#AEB2C4;
    font-size:17px;
    margin:14px auto 30px;max-width:570px;
  }

  /* platform tabs */
  .tabs{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .tab{
    padding:9px 18px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    color:#C7CAD9;
    background:rgba(255,255,255,.06);
    border:1px solid transparent;
    cursor:pointer;
  }
  .tab.active{
    background:var(--accent);
    color:var(--bg);
  }

  /* input bar */
  .fetch-bar{
    display:flex;
    background:#fff;
    border-radius:999px;
    padding:6px;
    max-width:640px;
    margin:0 auto;
    box-shadow:0 20px 40px -18px rgba(0,0,0,.6);
  }
  .fetch-bar input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    padding:12px 18px;
    font-size:15px;
    color:var(--text);
    font-family:inherit;
    min-width:0;
  }
  :where(button,a,input,textarea,select):focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .fetch-bar button{
    background:var(--accent);
    color:var(--bg);
    border:none;
    border-radius:8px;
    padding:12px 26px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    transition:background .15s ease;
  }
  .fetch-bar button:hover{background:var(--accent-dark);}
  .input-tools{display:flex;align-items:center;gap:8px;padding-right:6px;}
  .paste-btn{border:0;background:#EEF0E8;color:var(--text);border-radius:7px;padding:9px 11px;font:600 12px Inter,sans-serif;cursor:pointer;}
  .paste-btn:hover{background:#E2E5D9;}
  .fetch-hint{
    color:#8B8FA3;
    font-size:13px;
    margin-top:14px;
  }
  .hero-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .hero-tool{border:1px solid rgba(255,255,255,.2);border-radius:7px;background:transparent;color:#fff;padding:8px 12px;font:600 12px Inter,sans-serif;cursor:pointer;}
  .hero-tool:hover{border-color:var(--accent);color:var(--accent);}
  .history-panel{max-width:640px;margin:18px auto 0;text-align:left;}
  .history-header{display:flex;align-items:center;justify-content:space-between;color:#C7CAD9;font-size:13px;font-weight:600;margin-bottom:8px;}
  .history-clear{border:0;background:transparent;color:#8B8FA3;font:600 11px Inter,sans-serif;cursor:pointer;}
  .history-list{display:flex;gap:6px;flex-wrap:wrap;}
  .history-item{border:1px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(255,255,255,.07);color:#E8EAF2;padding:7px 9px;font:600 11px Inter,sans-serif;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-item:hover{border-color:var(--accent);color:var(--accent);}
  .saved-url-section{max-width:640px;margin:18px auto 0;text-align:left;}
  .saved-url-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;color:#C7CAD9;font-size:13px;font-weight:600;}
  .saved-url-form{display:flex;gap:6px;margin-bottom:8px;}
  .saved-url-form input{min-width:0;flex:1;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(255,255,255,.07);color:#fff;padding:8px 10px;font:12px Inter,sans-serif;outline:none;}
  .saved-url-form input:focus{border-color:var(--accent);}
  .save-url-btn{border:1px solid rgba(255,255,255,.2);border-radius:7px;background:transparent;color:#fff;padding:7px 10px;font:600 12px Inter,sans-serif;cursor:pointer;}
  .save-url-btn:hover{border-color:var(--accent);color:var(--accent);}
  .saved-url-list{display:flex;flex-direction:column;gap:6px;max-height:176px;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;padding-right:2px;}
  .saved-url-list::-webkit-scrollbar{width:0;height:0;display:none;background:transparent;}
  .saved-url-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:8px;padding:8px 10px;}
  .saved-url-load{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:#E8EAF2;text-align:left;font:600 12px Inter,sans-serif;cursor:pointer;}
  .saved-url-load span{display:block;overflow:hidden;text-overflow:ellipsis;color:#8B8FA3;font-size:11px;font-weight:400;margin-top:2px;}
  .saved-url-remove{border:0;background:transparent;color:#8B8FA3;font-size:17px;line-height:1;cursor:pointer;padding:0 2px;}
  .saved-url-remove:hover{color:#fff;}
  .saved-library-section{border-top:1px solid rgba(255,255,255,.12);margin-top:14px;padding-top:12px;}
  .saved-library-title{color:#fff;font-size:13px;font-weight:700;margin-bottom:8px;text-align:left;}
  .saved-url-item.editing{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;}
  .saved-url-edit-fields{display:grid;gap:5px;min-width:0;}
  .saved-url-edit-fields input,.saved-url-edit-fields textarea{width:100%;min-width:0;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:rgba(255,255,255,.07);color:#fff;padding:6px 8px;font:12px Inter,sans-serif;outline:none;}
  .saved-url-edit-fields textarea{min-height:52px;resize:vertical;}
  .saved-url-edit-actions{display:flex;align-items:center;gap:5px;}
  .saved-url-edit{border:1px solid rgba(255,255,255,.2);border-radius:6px;background:transparent;color:#C7CAD9;padding:5px 7px;font:600 11px Inter,sans-serif;cursor:pointer;}
  .saved-url-edit:hover{border-color:var(--accent);color:var(--accent);}
  .batch-section{max-width:640px;margin:18px auto 0;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;}
  .batch-toggle{display:block;width:100%;margin:14px 0 0;border:1px solid rgba(255,255,255,.2);border-radius:7px;background:transparent;color:#fff;padding:9px 12px;font:600 12px Inter,sans-serif;cursor:pointer;text-align:left;}
  .batch-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .batch-header{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#fff;font-size:13px;font-weight:600;margin-bottom:8px;}
  .batch-header span{color:#8B8FA3;font-size:11px;font-weight:400;}
  .batch-name-tools{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .batch-name{width:170px;min-width:0;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(255,255,255,.07);color:#fff;padding:6px 8px;font:600 12px Inter,sans-serif;outline:none;}
  .batch-name:focus{border-color:var(--accent);}
  .batch-name-save{border:1px solid rgba(255,255,255,.2);border-radius:7px;background:transparent;color:#fff;padding:6px 8px;font:600 11px Inter,sans-serif;cursor:pointer;white-space:nowrap;}
  .batch-name-save:hover{border-color:var(--accent);color:var(--accent);}
  .batch-form{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:stretch;}
  .batch-form textarea{width:100%;min-width:0;min-height:68px;resize:vertical;scrollbar-width:none;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(255,255,255,.07);color:#fff;padding:9px 10px;font:12px/1.45 Inter,sans-serif;outline:none;}
  .batch-form textarea::-webkit-scrollbar{width:0;height:0;display:none;background:transparent;}
  .batch-form textarea:focus{border-color:var(--accent);}
  .batch-btn{border:0;border-radius:7px;background:var(--accent);color:var(--bg);padding:10px 12px;font:700 12px Inter,sans-serif;cursor:pointer;white-space:nowrap;}
  .batch-btn:hover{background:var(--accent-dark);}
  .batch-status{color:#8B8FA3;font-size:11px;margin:8px 0 0;}
  .web-tools-modal{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;align-items:stretch;justify-content:stretch;padding:0;}
  .web-tools-modal.open{display:flex;}
  .web-tools-dialog{width:100%;height:100%;max-height:none;overflow:auto;background:var(--bg);border:0;border-radius:0;padding:clamp(20px,5vw,56px) max(20px,calc((100vw - 760px) / 2));box-shadow:none;color:#fff;}
  .web-tools-dialog-header{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;margin-bottom:4px;}
  .web-tools-dialog-header h2{font-size:20px;}
  .web-tools-subtitle{display:block;color:#AEB2C4;font-size:12px;margin-top:3px;}
  .web-tools-dialog-actions{display:flex;align-items:center;gap:8px;}
  .web-tools-close{width:34px;height:34px;border:0;border-radius:50%;background:#fff;color:var(--bg);font-size:22px;line-height:1;cursor:pointer;}
  .web-settings-layout{display:grid;grid-template-columns:minmax(128px,28%) minmax(0,1fr);gap:20px;min-height:0;margin-top:24px;}
  .web-settings-nav{display:flex;flex-direction:column;align-items:stretch;gap:4px;border-right:1px solid rgba(255,255,255,.12);padding:0 16px 0 0;}
  .web-settings-nav-item{border:0;border-radius:8px;background:transparent;color:#AEB2C4;padding:11px 12px;font:600 12px Inter,sans-serif;text-align:left;cursor:pointer;}
  .web-settings-nav-item:hover,.web-settings-nav-item.active{background:rgba(200,243,90,.12);color:var(--accent);}
  .web-settings-layout:not(.detail-open) .web-settings-content{display:none;}
  .web-settings-content{min-width:0;max-width:760px;margin:0 auto;}
  .web-settings-back{border:0;background:transparent;color:#AEB2C4;padding:0 0 16px;font:600 12px Inter,sans-serif;cursor:pointer;}
  .web-settings-back:hover{color:var(--accent);}
  .web-settings-section h3{font:700 24px 'Space Grotesk',sans-serif;color:#fff;margin:0 0 16px;}
  .settings-section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .settings-section-heading h3{margin:0;}
  .settings-history-list{display:flex;flex-direction:column;gap:7px;}
  .settings-history-item{display:flex;align-items:center;gap:12px;width:100%;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;padding:11px 12px;text-align:left;cursor:pointer;}
  .settings-history-item:hover{border-color:var(--accent);background:rgba(200,243,90,.08);}
  .settings-history-url{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
  .settings-history-platform{flex:0 0 auto;color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .web-settings-dialog-note{color:#AEB2C4;font-size:13px;}
  .web-tools-dialog .batch-section,.web-tools-dialog .saved-url-section{display:block;max-width:none;margin:14px 0 0;}
  .web-settings-section .saved-library-section{margin-top:20px;}
  .web-settings-section .saved-url-list{max-height:none;overflow:visible;}
  .saved-filter-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .saved-filter-option{border:1px solid rgba(255,255,255,.2);border-radius:7px;background:transparent;color:#fff;padding:9px 12px;font:700 12px Inter,sans-serif;cursor:pointer;}
  .saved-filter-option.active{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  .media-type-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px;}
  .media-type-option{border:1px solid rgba(255,255,255,.2);border-radius:7px;background:transparent;color:#fff;padding:10px 12px;font:700 12px Inter,sans-serif;cursor:pointer;}
  .media-type-option.active{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  #media-type-hint{grid-column:1 / -1;color:#8B8FA3;font-size:11px;margin:2px 0 0;}
  .web-filter-panel{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .web-filter-panel label{display:flex;align-items:center;gap:6px;color:#8B8FA3;font-size:11px;}
  .web-filter-panel select{border:1px solid rgba(255,255,255,.2);border-radius:7px;background:#202723;color:#fff;padding:7px 8px;font:600 11px Inter,sans-serif;}

  /* result card (hidden by default, shown after "download") */
  .result-card{
    max-width:640px;
    margin:20px auto 0;
    background:#fff;
    border-radius:var(--radius);
    padding:16px;
    display:none;
    text-align:left;
    color:var(--text);
    gap:14px;
    align-items:center;
  }
  .result-card.gallery{display:none;}
  .result-card.gallery.show{display:block;}
  .result-card.show{animation:result-in .24s ease-out both;}
  @keyframes result-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .result-thumb{
    width:96px;height:96px;
    border-radius:10px;
    background:linear-gradient(135deg,#27302C,#65725B);
    flex-shrink:0;
  }
  .result-body{flex:1;min-width:0;}
  .media-grid{display:grid;grid-template-columns:1fr;gap:16px;max-width:760px;margin:20px auto 0;}
  .media-grid.gallery-mode{display:block;columns:4 220px;column-gap:14px;max-width:1120px;}
  .media-item{background:#fff;color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}
  .gallery-mode .gallery-tile{display:inline-block;width:100%;min-width:0;padding:0;border:1px solid rgba(255,255,255,.1);border-radius:10px;overflow:hidden;cursor:pointer;break-inside:avoid;margin:0 0 14px;background:#202824;position:relative;box-shadow:0 8px 22px rgba(16,19,22,.12);}
  .media-item img{background:#fff;}
  .media-item img,.media-item video{display:block;width:100%;max-height:520px;aspect-ratio:16 / 9;object-fit:contain;border-radius:8px;background:#101316;margin-bottom:12px;}
  .media-item .image-preview{height:min(62vw,520px);aspect-ratio:4 / 3;object-fit:cover;background:#101316;}
  .gallery-mode .gallery-tile img{height:auto;max-height:none;aspect-ratio:auto;object-fit:cover;margin:0;border-radius:0;transition:transform .2s ease;}
  .gallery-mode .gallery-tile .image-preview{object-fit:cover;background:#101316;}
  .gallery-mode .gallery-tile:hover img{transform:scale(1.04);}
  .gallery-mode .gallery-tile .media-item-body{display:none;}
  .gallery-actions{grid-column:1 / -1;display:flex;flex-direction:column;gap:10px;width:100%;}
  .gallery-mode .gallery-actions{column-span:all;break-inside:avoid;}
  .gallery-actions .load-more-media{width:100%;}
  .hide-image{position:absolute;right:7px;top:7px;border:0;border-radius:6px;background:rgba(16,19,22,.82);color:#fff;padding:6px 8px;font:600 11px Inter,sans-serif;cursor:pointer;opacity:0;transition:opacity .15s ease;z-index:1;}
  .gallery-tile .hide-image{pointer-events:none;}
  .gallery-tile:hover .hide-image,.gallery-tile:focus-within .hide-image{opacity:1;pointer-events:auto;}
  .load-more-media{grid-column:1 / -1;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);padding:11px;font:600 13px Inter,sans-serif;cursor:pointer;}
  .load-more-media:hover{background:#EEF0E8;}
  .batch-navigation{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;}
  .batch-navigation .load-more-media{flex:1;min-width:150px;}
  .fetch-again{grid-column:1 / -1;}
  #unhide-images-btn{display:block;margin:10px auto 0;}
  .image-fallback{height:100%;min-height:120px;display:grid;place-items:center;background:#27302C;color:#AEB2C4;font-size:12px;}
  .gallery-viewer{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 42%,#344139 0,#151b18 54%,#0d100f 100%);display:none;align-items:center;justify-content:center;padding:76px 72px 48px;backdrop-filter:blur(14px);}
  .gallery-viewer.open{display:flex;}
  .gallery-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pinch-zoom;-webkit-overflow-scrolling:touch;}
  .gallery-track::-webkit-scrollbar{width:0;height:0;display:none;background:transparent;}
  .gallery-track::-webkit-scrollbar-thumb{background:transparent;}
  .gallery-slide{min-width:100%;height:100%;display:grid;place-items:center;scroll-snap-align:center;scroll-snap-stop:always;}
  .gallery-slide img{display:block;width:auto;height:auto;max-width:min(92vw,1200px);max-height:calc(100vh - 150px);aspect-ratio:auto;object-fit:contain;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.5);}
  .gallery-slide img[alt]{outline:0;}
  .gallery-topbar{position:absolute;left:24px;right:76px;top:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;color:#fff;font:600 13px Inter,sans-serif;z-index:2;pointer-events:none;}
  .gallery-topbar span{max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gallery-topbar span:last-child{max-width:none;color:#fff;font-weight:600;background:rgba(16,19,22,.72);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 11px;}
  .gallery-nav{position:absolute;top:50%;z-index:2;transform:translateY(-50%);width:44px;height:44px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(16,19,22,.72);color:#fff;font-size:20px;cursor:pointer;}
  .gallery-nav:hover{background:var(--accent);color:var(--bg);}
  .gallery-prev{left:18px;}.gallery-next{right:18px;}
  .privacy-intro{color:#AEB2C4;font-size:13px;line-height:1.6;margin:10px 0 16px;max-width:58ch;text-align:left;}
  .privacy-toggle{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:center;max-width:400px;margin:0 auto;border-top:1px solid rgba(255,255,255,.12);padding:12px 0;cursor:pointer;}
  .privacy-toggle input{width:20px;height:20px;margin:0;accent-color:var(--accent);}
  .privacy-toggle > span{text-align:left;}
  .privacy-toggle b{display:block;font-size:13px;}.privacy-toggle small{display:block;color:#AEB2C4;font-size:11px;margin-top:2px;line-height:1.35;}
  .danger-btn{border:1px solid #d98275;border-radius:8px;background:rgba(124,47,38,.2);color:#ffb3a8;padding:11px 13px;font:700 12px Inter,sans-serif;cursor:pointer;margin-top:8px;}
  .danger-btn:hover{background:#542923;}
  .privacy-note{color:#AEB2C4;font-size:12px;min-height:18px;margin:12px 0 0;}
  .cache-summary{display:grid;gap:10px;color:#E8EAF2;font-size:14px;line-height:1.5;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:16px;}
  .cache-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

    const entries = readHistory();
    historyPanel.hidden = true;
    historyList.innerHTML = entries.map((entry, index) => `<button class="history-item" type="button" data-history-index="${index}" title="${escapeHtml(entry.url)}">${escapeHtml(entry.name || entry.platform || 'Recent link')}</button>`).join('');
    if (settingsHistoryList) {
      settingsHistoryList.innerHTML = entries.length
        ? entries.map((entry, index) => `<button class="settings-history-item" type="button" data-settings-history-index="${index}" title="${escapeHtml(entry.url)}"><span class="settings-history-url">${escapeHtml(entry.url)}</span><span class="settings-history-platform">${escapeHtml(entry.platform || 'Web')}</span></button>`).join('')
        : '<div class="batch-status">No recent history yet.</div>';
    }
  }

  function recordHistory(url, platform, name = '') {
    if (privacySettings().privateMode || privacySettings().noHistory) return;
    const entries = [{ url, platform, name: name || (() => { try { return new URL(url).hostname; } catch { return 'Recent link'; } })(), savedAt: Date.now() }, ...readHistory().filter(entry => entry.url !== url)];
    saveHistory(entries);
    renderHistory();
  }

  function setResultStatus(message, kind = '') {
    resultStatus.textContent = message || '';
    resultStatus.className = `result-status${kind ? ` ${kind}` : ''}`;
  }

  function readHiddenImages() {
    try { return new Set(JSON.parse(localStorage.getItem(hiddenImagesKey) || '[]')); } catch { return new Set(); }
  }

  function mediaKey(item) {
    return item.id || item.downloads?.image || item.thumbnail || `${item.title}-${item.index}`;
  }

  function visibleMediaItems() {
    const hidden = readHiddenImages();
    const filtered = renderedMediaItems.filter(item => !hidden.has(mediaKey(item)) && (mediaFilters.type === 'all' || item.type === mediaFilters.type));
    return filtered;
  }

  function updateUnhideButton() {
    unhideImagesButton.hidden = readHiddenImages().size === 0;
  }

  function hideImage(item) {
    const hidden = readHiddenImages();
    hidden.add(mediaKey(item));
    try { localStorage.setItem(hiddenImagesKey, JSON.stringify([...hidden])); } catch {}
    updateUnhideButton();
    renderMediaBatch(true);
    if (galleryViewer.classList.contains('open')) closeGallery();
  }

  function renderSavedUrls() {
    const entries = readSavedUrls();
    const matchesFilter = entry => savedFilterType === 'all' || savedMediaType(entry) === savedFilterType;
    const renderEntry = (entry, index, batch) => {
      const type = savedMediaType(entry);
      const value = batch ? entry.urls.join('\n') : entry.url;
      const name = entry.name || (batch ? 'Saved batch' : 'Saved link');
      if (!matchesFilter(entry)) return '';
      return `<div class="saved-url-item"><button class="saved-url-load" type="button" data-url="${escapeHtml(value)}" data-batch="${batch}" data-media-type="${type}" title="Open ${escapeHtml(name)}">${escapeHtml(name)}<span>${escapeHtml(batch ? `${entry.urls.length} URLs` : entry.url)} · ${type}s</span></button><div class="saved-url-edit-actions"><button class="saved-url-edit" type="button" data-offline-index="${index}" aria-label="Cache ${escapeHtml(name)} for offline viewing">Cache offline</button><button class="saved-url-edit" type="button" data-edit-index="${index}" data-edit-batch="${batch}">Edit</button><button class="saved-url-remove" type="button" data-index="${index}" aria-label="Remove ${batch ? 'saved batch' : 'saved link'}">&times;</button></div></div>`;
    };
    savedUrlList.innerHTML = entries.map((entry, index) => Array.isArray(entry.urls) ? '' : renderEntry(entry, index, false)).join('') || '<div class="batch-status">No saved links for this filter.</div>';
    savedBatchList.innerHTML = entries.map((entry, index) => Array.isArray(entry.urls) ? renderEntry(entry, index, true) : '').join('') || '<div class="batch-status">No saved batches for this filter.</div>';
  }

  function setActiveTab(platform) {
    const tab = document.querySelector(`.tab[data-platform="${platform}"]`);
    if (tab) tab.click();
  }

  function detectPlatform(value) {
    try {
      const host = new URL(value).hostname.replace('www.', '');
      const domains = {'tiktok.com':'TikTok','instagram.com':'Instagram','facebook.com':'Facebook','fb.watch':'Facebook','x.com':'X','twitter.com':'X','youtube.com':'YouTube','youtu.be':'YouTube','pinterest.com':'Pinterest','reddit.com':'Reddit','snapchat.com':'Snapchat'};
      const domain = Object.keys(domains).find(name => host === name || host.endsWith('.' + name));
      return domain ? domains[domain] : 'Social media';
    } catch { return 'Social media'; }
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
  }

  function setWebMediaType(type) {
    selectedWebMediaType = ['auto', 'all', 'image', 'video', 'audio'].includes(type) ? type : 'auto';
    mediaTypeOptions.forEach(option => {
      const active = option.dataset.mediaType === selectedWebMediaType;
      option.classList.toggle('active', active);
      option.setAttribute('aria-pressed', String(active));
    });
    mediaTypeHint.textContent = ({ auto: 'Scan a public page and ClipGrab will find images, videos, and audio it can access.', all: 'Scan every supported media type on the page.', image: 'Show images only and skip video and audio discovery.', video: 'Show videos only and skip image and audio discovery.', audio: 'Show audio sources only.' })[selectedWebMediaType];
    renderSavedUrls();
  }

  function setSavedFilter(type) {
    savedFilterType = ['all', 'image', 'video', 'audio'].includes(type) ? type : 'all';
    savedFilterOptions.forEach(option => {
      const active = option.dataset.savedFilter === savedFilterType;
      option.classList.toggle('active', active);
      option.setAttribute('aria-pressed', String(active));
    });
    renderSavedUrls();
  }

  function setSettingsSection(section) {
    const selected = ['saved', 'history', 'save', 'privacy', 'cache'].includes(section) ? section : 'saved';
    settingsLayout.classList.add('detail-open');
    settingsNavItems.forEach(item => item.classList.toggle('active', item.dataset.settingsSection === selected));
    settingsSections.forEach(panel => { panel.hidden = panel.dataset.settingsPanel !== selected; });
    if (selected === 'cache') updateCacheSummary();
  }

  function showSettingsSections() {
    settingsLayout.classList.remove('detail-open');
    settingsNavItems.forEach(item => item.classList.remove('active'));
    settingsSections.forEach(panel => { panel.hidden = true; });
  }

  async function updateCacheSummary() {
    cacheSummary.textContent = 'Checking browser cache...';
    try {
      const cacheNames = 'caches' in window ? await caches.keys() : [];
      let cachedResponses = 0;
      for (const name of cacheNames) {
        const entries = await (await caches.open(name)).keys();
        cachedResponses += entries.length;
      }
      const estimate = await navigator.storage?.estimate?.();
      const usage = Number(estimate?.usage);
      const quota = Number(estimate?.quota);
      const usageLabel = Number.isFinite(usage) ? `${(usage / 1024 / 1024).toFixed(1)} MB used` : 'Size unavailable';
      const quotaLabel = Number.isFinite(quota) ? ` of ${(quota / 1024 / 1024).toFixed(0)} MB browser storage` : '';
      cacheSummary.innerHTML = `<strong>${cachedResponses} cached responses</strong><span>${usageLabel}${quotaLabel}</span><span>${cacheNames.length} browser cache${cacheNames.length === 1 ? '' : 's'} available</span>`;
    } catch {
      cacheSummary.textContent = 'Browser cache information is unavailable in this browser.';
    }
  }

  function savedMediaType(entry) {
    if (entry.mediaType === 'audio') return 'audio';
    if (entry.mediaType === 'video') return 'video';
    if (entry.mediaType === 'image') return 'image';
    const value = Array.isArray(entry.urls) ? entry.urls.join('\n') : entry.url || '';
    return /\.(?:mp4|webm|mov|m4v|ogv)(?:[?#]|$)/i.test(value) ? 'video' : 'image';
  }

  function readWebResultsCache() {
    try { return JSON.parse(localStorage.getItem(webResultsCacheKey) || '{}'); } catch { return {}; }
  }

  function getCachedWebResult(url, mediaType = selectedWebMediaType) {
    const entry = readWebResultsCache()[`${mediaType}:${url}`];
    return entry && entry.data && Date.now() - entry.savedAt < 60 * 60 * 1000 ? entry.data : null;
  }

  function cacheWebResult(url, data, mediaType = selectedWebMediaType) {
    if (privacySettings().privateMode) return;
    try {
      const cache = readWebResultsCache();
      cache[`${mediaType}:${url}`] = { savedAt: Date.now(), data };
      const recentEntries = Object.entries(cache).sort(([, first], [, second]) => second.savedAt - first.savedAt).slice(0, 10);
      localStorage.setItem(webResultsCacheKey, JSON.stringify(Object.fromEntries(recentEntries)));
    } catch {}
  }

  function startRequestCooldown(seconds) {
    requestCooldownUntil = Date.now() + Math.max(1, Number(seconds) || 60) * 1000;
    fetchSubmitButton.disabled = true;
    clearInterval(requestCooldownTimer);
    const update = () => {
      const remaining = Math.max(0, Math.ceil((requestCooldownUntil - Date.now()) / 1000));
      fetchHint.textContent = remaining ? `Too many requests. Try again in ${remaining} seconds.` : 'You can fetch again now.';
      if (!remaining) {
        clearInterval(requestCooldownTimer);
        requestCooldownTimer = null;
        fetchSubmitButton.disabled = false;
      }
    };
    update();
    requestCooldownTimer = setInterval(update, 1000);
  }

  function assertRequestAllowed() {
    const remaining = Math.max(0, Math.ceil((requestCooldownUntil - Date.now()) / 1000));
    if (remaining) throw new Error(`Please wait ${remaining} seconds before fetching again.`);
  }

  async function fetchMediaRequest(url, mediaType = null) {
    assertRequestAllowed();
    const body = { url };
    if (selectedPlatform === 'Web' && mediaType) body.mediaType = mediaType;
    const response = await fetch('/api/media', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    if (response.status === 429) {
      const retryAfter = Number(response.headers.get('Retry-After')) || 60;
      startRequestCooldown(retryAfter);
    }
    return response;
  }

  function snapVidUrl(platform) {
    return ({TikTok:'https://en.snapvid.app/', Instagram:'https://snapvid.net/en/instagram-downloader', Facebook:'https://snapvid.net/en/facebook-downloader', Twitter:'https://snapvid.net/en2/twitter-downloader', X:'https://snapvid.net/en2/twitter-downloader', Web:'https://snapvid.net/en/'})[platform] || 'https://snapvid.net/en/';
  }

  function failedUrlPlatform() {
    const platform = detectPlatform(urlInput.value.trim());
    return platform === 'Social media' ? selectedPlatform : platform;
  }

  function showErrorWithFallback(message, platform = selectedPlatform) {
    const isTikTok = platform === 'TikTok';
    resultSub.textContent = message || 'The media could not be downloaded.';
    setResultStatus('Check the link or try again.', 'error');
    retryButton.hidden = false;
    copyResultButton.hidden = false;
    const link = document.createElement('a');
    link.className = 'external-download';
    link.href = snapVidUrl(platform);
    link.dataset.sourceUrl = urlInput.value.trim();
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = isTikTok ? 'Try SnapVid for now' : 'If this does not work, try SnapVid';
    resultSub.append(' ', link);
  }

  function safeFileName(value, fallback = 'clipgrab-media') {
    const cleaned = String(value || '').replace(/[<>:"/\\|?*\u0000-\u001f]/g, '').trim().replace(/\s+/g, ' ');
    return cleaned.slice(0, 80) || fallback;
  }

  async function downloadFile(target, button, fileName) {
    if (!target) return;
    button.disabled = true;
    const originalLabel = button.textContent;
    const progress = button.closest('.media-item')?.querySelector('.progress-bar');
    try {
      const url = new URL(target, window.location.origin);
      url.searchParams.set('name', safeFileName(fileName));
      setResultStatus('Preparing your download...');
      const response = await fetch(url);
      if (!response.ok) throw new Error((await response.text()) || 'The download failed.');
      const total = Number(response.headers.get('content-length'));
      const reader = response.body?.getReader();
      const chunks = [];
      let received = 0;
      while (reader) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.byteLength;
        const percent = total > 0 ? Math.round(received / total * 100) : 0;
        button.textContent = percent ? `Downloading ${percent}%` : 'Downloading...';
        if (progress && percent) progress.style.width = `${percent}%`;
      }
      const blob = new Blob(chunks, { type: response.headers.get('content-type') || 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = safeFileName(fileName);
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      setResultStatus('Download ready.', 'success');
      button.textContent = 'Downloaded';
    } catch (error) {
      setResultStatus(error.message || 'The download failed. Try again.', 'error');
      button.textContent = 'Retry download';
    } finally {
      setTimeout(() => { button.disabled = false; if (button.textContent === 'Downloaded') button.textContent = originalLabel; }, 1500);
    }
  }

  async function downloadAllImages(button) {
    const images = visibleMediaItems().filter(item => item.type === 'image' && item.downloads?.image);
    if (!images.length) return;
    button.disabled = true;
    const originalLabel = button.textContent;
    try {
      for (let index = 0; index < images.length; index += 1) {
        button.textContent = `Downloading ${index + 1} of ${images.length}`;
        await downloadFile(images[index].downloads.image, button, `${safeFileName(images[index].title, `clipgrab-image-${index + 1}`)}.jpg`);
      }
      setResultStatus(`Downloaded ${images.length} images.`, 'success');
    } finally {
      button.disabled = false;
      button.textContent = originalLabel;
    }
  }

  async function keepMediaOffline(target, button) {
    const settings = privacySettings();
    if (settings.privateMode || !settings.offline) {
      privacyStatus.textContent = settings.privateMode ? 'Private mode prevents offline storage.' : 'Enable Allow offline media first.';
      openPrivacySettings();
      setSettingsSection('privacy');
      return;
    }
    try {
      const mediaType = button.dataset.offlineType || 'video';
      const cache = await caches.open(offlineCacheNames[mediaType]);
      if (await cache.match(target)) {
        await cache.delete(target);
        button.textContent = 'Keep offline';
        setResultStatus('Offline copy deleted.', 'success');
        return;
      }
      const response = await fetch(target);
      if (!response.ok) throw new Error('Media could not be saved offline.');
      await cache.put(target, response.clone());
      button.textContent = `Delete ${mediaType} cache`;
      setResultStatus('This media is available offline.', 'success');
    } catch (error) {
      setResultStatus(error.message || 'Offline save failed.', 'error');
    }
  }

  async function cacheSavedEntryOffline(entry, button) {
    const settings = privacySettings();
    if (settings.privateMode || !settings.offline) {
      privacyStatus.textContent = settings.privateMode ? 'Private mode prevents offline storage.' : 'Enable Allow offline media first.';
      setSettingsSection('privacy');
      return;
    }
    const urls = Array.isArray(entry.urls) ? entry.urls : [entry.url];
    const mediaType = entry.mediaType || 'auto';
    const originalLabel = button.textContent;
    button.disabled = true;
    let cachedCount = 0;
    try {
      for (let index = 0; index < urls.length; index += 1) {
        button.textContent = `Scanning ${index + 1} of ${urls.length}`;
        const cachedResult = getCachedWebResult(urls[index], mediaType);
        let data = cachedResult;
        if (!data) {
          const response = await fetch('/api/media', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: urls[index], mediaType }) });
          const responseText = await response.text();
          try { data = JSON.parse(responseText); } catch { data = { error: responseText.trim() }; }
          if (!response.ok || !Array.isArray(data.items)) throw new Error(data.error || 'Could not find media for offline viewing.');
          cacheWebResult(urls[index], data, mediaType);
        }
        const targets = [...new Set(data.items.flatMap(item => {
          if (item.type === 'image') return [item.thumbnail];
          if (item.type === 'video') return [item.downloads?.video ? `${item.downloads.video}&preview=1` : ''];
          return [item.downloads?.audio || ''];
        }).filter(Boolean))];
        for (const target of targets) {
          try {
            const request = new Request(new URL(target, window.location.origin), { credentials: 'same-origin' });
            if (new URL(request.url).origin !== window.location.origin) continue;
            const response = await fetch(request);
            const itemType = data.items.find(item => [item.thumbnail, item.downloads?.video ? `${item.downloads.video}&preview=1` : '', item.downloads?.audio || ''].includes(target))?.type || 'image';
            if (response.ok) { await (await caches.open(offlineCacheNames[itemType])).put(request, response.clone()); cachedCount += 1; }
          } catch {}
        }
      }
      button.textContent = 'Available offline';
      cacheStatus.textContent = `${cachedCount} media response${cachedCount === 1 ? '' : 's'} cached for offline viewing.`;
    } catch (error) {
      button.textContent = originalLabel;
      cacheStatus.textContent = error.message || 'Offline caching failed.';
    } finally {
      button.disabled = button.textContent === 'Available offline';
    }
  }

  function webWindowSize(items) {
    return items.some(item => item.type === 'video' || item.type === 'audio') ? 1 : webImageWindowSize;
  }

  function renderMedia(items, galleryMode = items.length > 0 && items.every(item => item.type === 'image')) {
    mediaGrid.classList.remove('loading');
    renderedMediaItems = items.map((item, index) => ({ ...item, id: item.id || `${item.downloads?.image || item.thumbnail || item.title}-${index}` }));
    renderedMediaStart = 0;
    renderedMediaCount = selectedPlatform === 'Web'
      ? Math.min(webWindowSize(renderedMediaItems), visibleMediaItems().length)
      : galleryMode ? Math.min(mediaBatchSize, visibleMediaItems().length) : visibleMediaItems().length;
    if (!renderedMediaItems.length) {
      mediaGrid.classList.remove('loading', 'gallery-mode');
      mediaGrid.innerHTML = '<div class="empty-state">No downloadable media was found at this URL.</div>';
      return;
    }
    renderMediaBatch(galleryMode);
  }

  function renderBatchSource(sourceIndex) {
    batchSourceIndex = sourceIndex;
    const source = batchSources[sourceIndex];
    if (!source) return;
    urlInput.value = source.url;
    const sourceItems = source.items || [];
    renderedMediaItems = sourceItems;
    renderedMediaStart = 0;
    const galleryMode = sourceItems.length > 0 && sourceItems.every(item => item.type === 'image');
    renderedMediaCount = selectedPlatform === 'Web'
      ? Math.min(webWindowSize(sourceItems), visibleMediaItems().length)
      : Math.min(mediaBatchSize, visibleMediaItems().length);
    resultTitle.textContent = batchSources.length > 1
      ? `URL ${sourceIndex + 1} of ${batchSources.length}`
      : 'URL';
    const batchNavigation = `${batchSourceIndex > 0 ? '<button class="load-more-media" type="button" data-batch-direction="previous">Jump to previous</button>' : ''}${batchSourceIndex < batchSources.length - 1 ? '<button class="load-more-media" type="button" data-batch-direction="next">Jump to next</button>' : ''}`;
    if (source.loading) {
      resultSub.textContent = 'Finding media from this URL...';
      mediaGrid.innerHTML = batchNavigation ? `<div class="batch-navigation">${batchNavigation}</div>` : '';
      return;
    }
    if (source.error || !source.items?.length) {
      resultSub.textContent = source.error || 'No media was found at this URL.';
      mediaGrid.innerHTML = `<button class="load-more-media fetch-again" type="button" data-fetch-again="true">Fetch again</button>${batchNavigation ? `<div class="batch-navigation">${batchNavigation}</div>` : ''}`;
      return;
    }
    const mediaLabel = galleryMode ? 'image' : sourceItems[0]?.type || 'media';
    resultSub.textContent = `${visibleMediaItems().length} ${mediaLabel}${visibleMediaItems().length === 1 ? '' : 's'} from this URL.`;
    addSnapvidNotice(detectPlatform(source.url));
    renderMediaBatch(galleryMode);
  }

  async function fetchBatchSource(sourceIndex, force = false) {
    const source = batchSources[sourceIndex];
    if (!source || (source.items && !force)) {
      renderBatchSource(sourceIndex);
      return;
    }
    const requestToken = ++batchRequestToken;
    source.loading = true;
    source.error = '';
    renderBatchSource(sourceIndex);
    try {
      let data = selectedPlatform === 'Web' && !force ? getCachedWebResult(source.url, selectedWebMediaType) : null;
      if (!data) {
        const response = await fetchMediaRequest(source.url, selectedPlatform === 'Web' ? selectedWebMediaType : null);
        const responseText = await response.text();
        try { data = JSON.parse(responseText); } catch { data = { error: responseText.trim() }; }
        if (!response.ok || !Array.isArray(data.items)) throw new Error(data.error || 'Could not resolve this URL.');
        if (selectedPlatform === 'Web') cacheWebResult(source.url, data, selectedWebMediaType);
      }
      if (!Array.isArray(data.items)) throw new Error(data.error || 'Could not resolve this URL.');
      if (requestToken !== batchRequestToken) return;
      source.items = data.items.map(item => ({ ...item, title: `${detectPlatform(source.url)}: ${item.title}`, id: `${source.url}#${item.index}` }));
      source.error = '';
    } catch (error) {
      if (requestToken !== batchRequestToken) return;
      source.items = [];
      source.error = error.message || 'Could not resolve this URL.';
    } finally {
      if (requestToken === batchRequestToken) {
        source.loading = false;
        renderBatchSource(sourceIndex);
      }
    }
  }

  function renderMediaBatch(galleryMode) {
    mediaGrid.classList.toggle('gallery-mode', galleryMode);
    const visibleItems = visibleMediaItems();
    const items = visibleItems.slice(renderedMediaStart, renderedMediaStart + renderedMediaCount);
    const hasMoreItems = renderedMediaStart + renderedMediaCount < visibleItems.length;
    const hasPreviousItems = selectedPlatform === 'Web' && renderedMediaStart > 0;
    const webWindow = webWindowSize(visibleItems);
    const isWebVideo = selectedPlatform === 'Web' && webWindow === 1;
    const fetchAgain = selectedPlatform === 'Web' && (!batchMode || batchSourceIndex >= 0)
      ? '<button class="load-more-media fetch-again" type="button" data-fetch-again="true">Fetch again</button>'
      : '';
    const previousWindow = hasPreviousItems
      ? `<button class="load-more-media" type="button" data-web-previous-window="true">Show previous ${isWebVideo ? 'video' : 'images'}</button>`
      : '';
    const nextAction = hasMoreItems
      ? `<button class="load-more-media" type="button" data-web-next-window="${galleryMode || selectedPlatform === 'Web'}">Load next remaining ${isWebVideo ? 'video' : '10 images'} (${visibleItems.length - renderedMediaStart - renderedMediaCount} remaining)</button>`
      : batchMode && (batchSourceIndex > 0 || batchSourceIndex < batchSources.length - 1)
        ? `<div class="batch-navigation">${batchSourceIndex > 0 ? '<button class="load-more-media" type="button" data-batch-direction="previous">Jump to previous</button>' : ''}${batchSourceIndex < batchSources.length - 1 ? '<button class="load-more-media" type="button" data-batch-direction="next">Jump to next</button>' : ''}</div>`
        : '';
    const downloadAllImages = galleryMode && visibleItems.length > 1
      ? '<button class="load-more-media" type="button" data-download-all-images="true">Download all images</button>'
      : '';
    const galleryActions = previousWindow || nextAction || fetchAgain || downloadAllImages
      ? `<div class="gallery-actions">${downloadAllImages}${previousWindow}${nextAction}${fetchAgain}</div>`
      : '';
    mediaGrid.innerHTML = items.map(item => {
      const downloadType = item.type === 'image' ? 'image' : item.type === 'audio' ? 'audio' : 'video';
      const tooLong = item.type === 'video' && Number.isFinite(Number(item.duration)) && Number(item.duration) > Number(item.maxDuration || 900);
      const downloadTarget = item.downloads[downloadType] || '';
      const snapVidFallback = item.type === 'image' && !downloadTarget && failedUrlPlatform() === 'Instagram'
        ? '<a class="external-download snapvid-link" href="https://snapvid.net/en/instagram-downloader" target="_blank" rel="noopener">Try on SnapVid</a>'
        : '';
      const resolutions = item.resolutions.length ? `<select class="resolution" data-item="${item.index}" data-download="${escapeHtml(item.downloads.video)}"><option value="">Best available quality</option>${item.resolutions.map(height => `<option value="${height}" ${item.selectedHeight === height ? 'selected' : ''}>${height}p</option>`).join('')}</select>` : '';
      const formats = item.type === 'video' ? '<div class="format-picker" role="group" aria-label="Download format"><button class="format-option active" type="button" data-format="video" aria-pressed="true">MP4</button><button class="format-option" type="button" data-format="audio" aria-pressed="false">MP3</button></div>' : item.type === 'audio' ? '<div class="format-picker" role="group" aria-label="Download format"><button class="format-option active" type="button" data-format="audio" aria-pressed="true">MP3</button></div>' : '';
      const image = item.type === 'image'
          ? (item.thumbnail ? `<img class="image-preview" src="${escapeHtml(item.thumbnail)}" data-gallery-src="${escapeHtml(item.thumbnail)}" alt="${escapeHtml(item.title || 'Image')}">` : '<div class="result-thumb"></div>')
        : item.type === 'audio'
          ? `<audio controls preload="metadata" src="${escapeHtml(item.downloads.audio || '')}"></audio>`
          : (tooLong ? '<div class="result-thumb"></div>' : `<video controls preload="metadata"${item.thumbnail ? ` poster="${escapeHtml(item.thumbnail)}"` : ''} src="${escapeHtml(item.downloads.video)}&preview=1"></video>`);
      const warning = tooLong ? `<div class="result-sub">This video is too long to download.</div>` : '';
      const mediaMeta = [item.fileType || item.type?.toUpperCase(), item.sourceDomain].filter(Boolean).join(' · ');
      const offlineTarget = item.type === 'image' ? item.thumbnail : item.downloads?.[item.type === 'audio' ? 'audio' : 'video'] ? `${item.downloads[item.type === 'audio' ? 'audio' : 'video']}&preview=1` : '';
      const offlineButton = offlineTarget ? `<button class="external-download offline-save" type="button" data-offline-url="${escapeHtml(offlineTarget)}" data-offline-type="${downloadType}">Keep offline</button>` : '';
      const galleryTile = galleryMode && item.type === 'image' ? ' gallery-tile' : '';
      const hideButton = galleryTile ? `<button class="hide-image" type="button" data-hide-id="${escapeHtml(item.id)}" aria-label="Hide this image">Hide</button>` : '';
      return `<article class="media-item${galleryTile}" data-media-id="${escapeHtml(item.id)}">${hideButton}${image}<div class="media-item-body"><div class="media-item-title">${escapeHtml(item.title)}</div><div class="media-meta">${escapeHtml(mediaMeta)}</div>${warning}${!downloadTarget && !tooLong ? `<div class="result-sub">Preview only; the source did not expose the full image.${snapVidFallback ? ' Your link will be copied before SnapVid opens.' : ''}</div>` : ''}${tooLong ? '' : `<input class="file-name" type="text" placeholder="Optional file name" aria-label="Optional file name">${formats}${resolutions}<div class="progress-track" aria-hidden="true"><div class="progress-bar"></div></div>`}<div class="result-actions"><button class="dl-btn primary media-download" type="button" data-type="${downloadType}" data-url="${escapeHtml(downloadTarget)}" ${tooLong || !downloadTarget ? 'disabled' : ''}>${tooLong || !downloadTarget ? 'Unavailable' : `Download ${downloadType}`}</button>${offlineButton}${snapVidFallback}</div></div></article>`;
    }).join('') + galleryActions;
  }

    try {

      await new Promise(resolve => setTimeout(resolve, Math.max(0, 320 - (Date.now() - startedAt))));

      jumpOverlay.classList.remove('open');
      jumpOverlay.setAttribute('aria-hidden', 'true');

  async function searchMedia(value, force = false) {
    const requestToken = ++sessionRequestToken;
    new URL(value);

    resultCard.classList.add('show');

    fetchSubmitButton.disabled = true;
    mediaGrid.classList.add('loading');
    mediaGrid.innerHTML = '';
    let data = selectedPlatform === 'Web' && !force ? getCachedWebResult(value, selectedWebMediaType) : null;
    if (!data) {
      const response = await fetchMediaRequest(value, selectedPlatform === 'Web' ? selectedWebMediaType : null);
      const responseText = await response.text();
      try { data = JSON.parse(responseText); } catch { data = { error: responseText.trim() }; }
      if (!response.ok) throw new Error(data.error || 'The source could not be resolved.');
      if (selectedPlatform === 'Web') cacheWebResult(value, data, selectedWebMediaType);
    }
    if (requestToken !== sessionRequestToken) return;
    if (!data || !Array.isArray(data.items)) throw new Error(data.error || 'The source returned an invalid response.');
    if (!data.items.length) throw new Error('No downloadable media was found at this URL.');
    resultTitle.textContent = data.title || detectPlatform(value) + ' media ready';
    const scan = data.scan;
    const summary = scan ? `Found ${scan.images} image${scan.images === 1 ? '' : 's'}, ${scan.videos} video${scan.videos === 1 ? '' : 's'}, and ${scan.audio} audio source${scan.audio === 1 ? '' : 's'}.` : `${data.count || data.items.length} item${(data.count || data.items.length) === 1 ? '' : 's'} found.`;
    resultSub.textContent = `${summary} Choose a format where available.`;
    setResultStatus('Media ready.', 'success');
    copyResultButton.hidden = false;
    addSnapvidNotice(detectPlatform(value));
    renderMedia(data.items || []);
    fetchHint.textContent = 'Enjoy your media.';
    saveState({ platform: selectedPlatform, url: value, title: resultTitle.textContent, source: data.source, items: data.items || [] });

    recordHistory(value, selectedPlatform, resultTitle.textContent);

      if (direction === 'next' && batchSourceIndex < batchSources.length - 1) {

      if (loadMoreButton.dataset.fetchAgain === 'true') {

        return;

          renderMediaBatch(true);
        });
        return;
      }
      if (renderedMediaCount < visibleItems.length) {
        renderedMediaCount = Math.min(renderedMediaCount + mediaBatchSize, visibleItems.length);
        renderMediaBatch(true);
        restoreWindowScroll(window.scrollY);
      }
      return;
    }
    const galleryImage = e.target.closest('.gallery-mode .gallery-tile img[data-gallery-src]');
    if (galleryImage) {
      galleryImages = visibleMediaItems()
        .slice(renderedMediaStart, renderedMediaStart + renderedMediaCount)
        .filter(item => item.type === 'image');
      galleryIndex = galleryImages.findIndex(item => item.id === galleryImage.closest('[data-media-id]')?.dataset.mediaId);
      galleryIndex = Math.max(0, galleryIndex);
      galleryTrack.innerHTML = galleryImages.map((item, index) => `<div class="gallery-slide"><img data-gallery-index="${index}" data-gallery-src="${escapeHtml(item.thumbnail)}" alt=""></div>`).join('');

    const button = e.target.closest('.media-download');

    const states = readSectionStates();
    delete states[selectedPlatform];
    try { localStorage.setItem(sectionStatesKey, JSON.stringify(states)); } catch {}
    urlInput.value = '';
    resultTitle.textContent = 'Media link received';
    resultSub.textContent = 'Choose a format to continue';
    setResultStatus('');
    retryButton.hidden = true;
    copyResultButton.hidden = true;
    closeSessionButton.hidden = true;
    resultCard.classList.remove('show');
    mediaGrid.classList.remove('loading', 'gallery-mode');
    mediaGrid.innerHTML = '';
    document.getElementById('batch-input').value = '';
    document.getElementById('batch-status').textContent = '';
    batchNameInput.value = '';
    closeGallery();
    closeVideoViewer();
    closeWebTools();
  }
  let privacyPreviousFocus = null;
  function openPrivacySettings() {
    privacyPreviousFocus = document.activeElement;
    const settings = privacySettings();
    privateMode.checked = settings.privateMode;
    noHistoryMode.checked = settings.noHistory;
    offlineMode.checked = settings.offline && !settings.privateMode;
    webToolsScrollY = window.scrollY;
    setSettingsSection('saved');
    webToolsModal.classList.add('open');
    webToolsModal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('viewer-open');
    document.getElementById('web-tools-close').focus();
  }
  document.getElementById('web-tools-close').addEventListener('click', closeWebTools);
  closeSessionButton.addEventListener('click', closeSession);
  webToolsModal.addEventListener('click', event => {
    if (event.target === webToolsModal) closeWebTools();
  });
  function updatePrivacySetting(key, value) {
    const settings = privacySettings();
    settings[key] = value;
    if (key === 'privateMode' && value) {
      settings.offline = false;
      [storageKey, sectionStatesKey, savedUrlsKey, hiddenImagesKey, historyKey, webResultsCacheKey].forEach(item => { try { localStorage.removeItem(item); } catch {} });
      Promise.all(Object.values(offlineCacheNames).map(name => caches.delete(name))).catch(() => {});
      navigator.serviceWorker?.controller?.postMessage({ type: 'clear-offline' });
      renderHistory();
      renderSavedUrls();
    }
    if (key === 'noHistory' && value) {
      [savedUrlsKey, historyKey].forEach(item => { try { localStorage.removeItem(item); } catch {} });
      renderHistory();
      renderSavedUrls();
    }
    savePrivacySettings(settings);
    privacyStatus.textContent = 'Privacy settings updated.';
  }
  privateMode.addEventListener('change', () => updatePrivacySetting('privateMode', privateMode.checked));
  noHistoryMode.addEventListener('change', () => updatePrivacySetting('noHistory', noHistoryMode.checked));
  offlineMode.addEventListener('change', () => updatePrivacySetting('offline', offlineMode.checked));
  webToolsModal.addEventListener('click', event => {
    const offlineButton = event.target.closest('[data-offline-index]');
    if (offlineButton) {
      const entry = readSavedUrls()[Number(offlineButton.dataset.offlineIndex)];
      if (entry) cacheSavedEntryOffline(entry, offlineButton);
      return;
    }
    const removeButton = event.target.closest('.saved-url-remove');
    if (removeButton) {
      const urls = readSavedUrls();
      urls.splice(Number(removeButton.dataset.index), 1);
      saveSavedUrls(urls);
      renderSavedUrls();
      return;
    }
    const editButton = event.target.closest('.saved-url-edit');
    if (editButton) {
      const index = Number(editButton.dataset.editIndex);
      const entry = readSavedUrls()[index];
      if (!entry) return;
      const item = editButton.closest('.saved-url-item');
      const batch = editButton.dataset.editBatch === 'true';
      item.classList.add('editing');
      const editField = batch
        ? `<textarea data-edit-urls aria-label="Saved batch URLs">${escapeHtml(entry.urls.join('\n'))}</textarea>`
        : `<input type="url" data-edit-url value="${escapeHtml(entry.url || '')}" aria-label="Saved URL">`;
      item.innerHTML = `<div class="saved-url-edit-fields"><input type="text" data-edit-name value="${escapeHtml(entry.name || '')}" aria-label="Saved name">${editField}</div><div class="saved-url-edit-actions"><button class="saved-url-edit" type="button" data-save-edit="true" data-edit-index="${index}">Save</button><button class="saved-url-edit" type="button" data-cancel-edit="true">Cancel</button></div>`;
      return;
    }
    const saveEditButton = event.target.closest('[data-save-edit="true"]');
    if (saveEditButton) {
      const index = Number(saveEditButton.dataset.editIndex);
      const item = saveEditButton.closest('.saved-url-item');
      const urls = readSavedUrls();
      const entry = urls[index];
      if (!entry) return;
      const name = item.querySelector('[data-edit-name]')?.value.trim();
      if (Array.isArray(entry.urls)) {
        const values = item.querySelector('[data-edit-urls]')?.value.split(/[\n,]+/).map(value => value.trim()).filter(Boolean) || [];
        if (!values.length || values.some(value => { try { new URL(value); return false; } catch { return true; } })) return;
        entry.urls = values;
      } else {
        const value = item.querySelector('[data-edit-url]')?.value.trim();
        try { new URL(value); } catch { return; }
        entry.url = value;
      }
      entry.name = name || (Array.isArray(entry.urls) ? 'Saved batch' : 'Saved link');
      saveSavedUrls(urls);
      renderSavedUrls();
      return;
    }
    if (event.target.closest('[data-cancel-edit="true"]')) {
      renderSavedUrls();
      return;
    }
    const loadButton = event.target.closest('.saved-url-load');
    if (loadButton) {
      const savedScrollTop = window.scrollY;
      setWebMediaType(loadButton.dataset.mediaType);
      closeWebTools();
      if (loadButton.dataset.batch === 'true') {
        document.getElementById('batch-input').value = loadButton.dataset.url || '';
        batchNameInput.value = loadButton.querySelector('span') ? loadButton.firstChild.textContent.trim() : 'Saved batch';
        document.getElementById('batch-form').requestSubmit();
      } else {
        urlInput.value = loadButton.dataset.url || '';
        document.getElementById('fetch-form').requestSubmit();
      }
      restoreWindowScroll(savedScrollTop);
    }
  });
  mediaGrid.addEventListener('click', e => {
    const link = e.target.closest('.snapvid-link');
    if (!link) return;
    e.preventDefault();
    const target = link.href;
    const sourceUrl = link.dataset.sourceUrl || urlInput.value.trim();
    navigator.clipboard.writeText(sourceUrl).catch(() => {});
    window.open(target, '_blank', 'noopener');
  });
  urlInput.addEventListener('input', () => saveState({ platform: selectedPlatform, url: urlInput.value }));
  document.getElementById('gallery-close').addEventListener('click', closeGallery);
  galleryPrevious.addEventListener('click', () => { galleryIndex = Math.max(0, galleryIndex - 1); galleryTrack.scrollTo({ left: galleryTrack.clientWidth * galleryIndex, behavior: 'smooth' }); updateGalleryWindow(); });
  galleryNext.addEventListener('click', () => { galleryIndex = Math.min(galleryImages.length - 1, galleryIndex + 1); galleryTrack.scrollTo({ left: galleryTrack.clientWidth * galleryIndex, behavior: 'smooth' }); updateGalleryWindow(); });
  document.getElementById('video-close').addEventListener('click', closeVideoViewer);
  videoViewer.addEventListener('click', event => {
    if (event.target === videoViewer) closeVideoViewer();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (videoViewer.classList.contains('open')) closeVideoViewer();
      else if (galleryViewer.classList.contains('open')) closeGallery();
    }
    if (galleryViewer.classList.contains('open') && event.key === 'ArrowLeft') galleryPrevious.click();
    if (galleryViewer.classList.contains('open') && event.key === 'ArrowRight') galleryNext.click();
  });
  galleryViewer.addEventListener('click', event => {
    if (event.target === galleryViewer) document.getElementById('gallery-close').click();
  });
  galleryTrack.addEventListener('scroll', () => {
    if (galleryTrack.clientWidth) {
      const nextIndex = Math.round(galleryTrack.scrollLeft / galleryTrack.clientWidth);
      if (nextIndex !== galleryIndex) {
        galleryIndex = nextIndex;
        updateGalleryWindow();
      }
    }
  }, { passive: true });

  updateUnhideButton();
  renderHistory();
  if (navigator.share) shareButton.hidden = false;
  let deferredInstallPrompt;
  const standaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const setInstallButtonVisibility = () => { installButton.hidden = standaloneMode || !deferredInstallPrompt; };
  window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); deferredInstallPrompt = event; setInstallButtonVisibility(); });
  window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; installButton.hidden = true; });
  installButton.addEventListener('click', async () => { if (!deferredInstallPrompt) return; deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; setInstallButtonVisibility(); });
  setInstallButtonVisibility();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').then(() => navigator.serviceWorker.ready).then(registration => registration.active?.postMessage({ type: 'offline-setting', enabled: privacySettings().offline && !privacySettings().privateMode })).catch(() => {});

  const savedState = readState();
  renderSavedUrls();
  if (savedState) {
    if (savedState.platform && savedState.platform !== selectedPlatform) setActiveTab(savedState.platform);
    const states = readSectionStates();
    states[savedState.platform || selectedPlatform] = savedState;
    try { localStorage.setItem(sectionStatesKey, JSON.stringify(states)); } catch {}
    urlInput.value = savedState.url || '';
    restoreResults(savedState);
  }
  document.querySelector('.web-cta').addEventListener('click', () => { document.querySelector('.tab[data-platform="Web"]').click(); urlInput.focus(); });
  document.getElementById('reddit-web-btn').addEventListener('click', () => { document.querySelector('.tab[data-platform="Web"]').click(); urlInput.focus(); });

  // FAQ accordion
  document.querySelectorAll('.faq-item').forEach(item => {
    item.querySelector('.faq-q').addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
      if (!isOpen) item.classList.add('open');
    });
  });
</script>

</body>
</html>
